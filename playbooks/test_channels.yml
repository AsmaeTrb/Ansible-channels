- name: TEST - channels Rocky Linux 8
  hosts: uyuni_srv
  gather_facts: yes
  vars:
    uyuni_user: "admin"
    uyuni_pass: "alinealine"
    distros:
      - name: rockylinux8
        arch: x86_64
        channels:
          - rockylinux8-x86_64
          - rockylinux8-x86_64-appstream
          - rockylinux8-x86_64-extras
          - rockylinux8-uyuni-client-x86_64
  tasks:
    - name: "Vérifier si le conteneur Uyuni est démarré"
      shell: |
        if ! podman ps --filter "name=uyuni-server" --format "{{ '{{' }}.Names{{ '}}' }}" | grep -q uyuni-server; then
          echo "starting"
          podman start uyuni-server
        else
          echo "running"
        fi
      register: uyuni_container_status
      changed_when: "'starting' in uyuni_container_status.stdout"

    - name: "Attendre que le conteneur soit prêt"
      wait_for:
        timeout: 60
      when: uyuni_container_status.changed

    - name: "Créer channels par distro"
      command: >
        mgrctl exec --
        spacewalk-common-channels
        -s localhost
        -u {{ uyuni_user }}
        -p {{ uyuni_pass }}
        -a {{ item.arch }}
        {{ item.name }}
      loop: "{{ distros }}"
      loop_control:
        label: "{{ item.name }}"
      register: channel_create
      changed_when: "'already exists' not in channel_create.stdout"
      failed_when: channel_create.rc != 0 and 'already exists' not in channel_create.stdout

    - name: "Attendre fin de sync en cours"
      # ✅ FIX 1 : mgrctl exec pour tester DANS le conteneur
      command: >
        mgrctl exec -- test ! -f /var/lib/spacewalk/reposync/{{ item.1 }}.lock
      loop: "{{ distros | subelements('channels') }}"
      loop_control:
        label: "{{ item.1 }}"
      register: lock_check
      until: lock_check.rc == 0
      retries: 60
      delay: 60
      failed_when: false

    - name: "Synchroniser channel"
      command: mgrctl exec -- spacewalk-repo-sync -c {{ item.1 }}
      loop: "{{ distros | subelements('channels') }}"
      loop_control:
        label: "{{ item.1 }}"
      # ✅ FIX 2 : plus d'async → exécution séquentielle, un channel à la fois
